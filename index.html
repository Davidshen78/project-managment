<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>AI Project Management Machine — 360 PM Prompts</title><style>
:root{--bg:#06111d;--card:#0b1b2a;--line:#244058;--txt:#eaf2f7;--muted:#8fa5b8;--accent:#55d6a3}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#06111d,#0a1928);color:var(--txt);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.langs button,.controls select,.controls input{background:#0b1b2a;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px 12px}.langs button{cursor:pointer}.langs .on{border-color:var(--accent)}.controls{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}.controls>*{flex:1;min-width:190px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px}.card h3{font-size:15px;margin:0 0 8px}.card p{color:var(--muted);font-size:13px;min-height:42px}.card button,.buy button{cursor:pointer;border:1px solid var(--line);background:#10263a;color:#fff;border-radius:9px;padding:9px 12px;width:100%}.card .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card .download{background:#0d3140}.buy{margin-top:22px;text-align:center;border:1px solid var(--accent);border-radius:15px;padding:20px;background:#081d2a}.buy button{margin-top:10px;background:var(--accent);color:#062016;font-weight:800;max-width:300px}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.open{display:flex}.box{max-width:820px;max-height:90vh;overflow:auto;background:#091827;border:1px solid var(--line);border-radius:16px;padding:22px}.box pre{white-space:pre-wrap;font:inherit}.close{float:right;cursor:pointer}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.controls{display:block}.controls>*{display:block;width:100%;margin-bottom:9px}}
</style></head><body><main class="wrap"><div class="top"><div><h1 id="title">AI Project Management Machine</h1><p id="sub">128 унікальних професійних PM-сценаріїв</p></div><div class="langs"><button data-l="uk" class="on">UA</button><button data-l="en">EN</button><button data-l="pl">PL</button></div></div><div class="controls"><select id="cat"></select><input id="search" placeholder="Пошук сценарію..."></div><div class="grid" id="grid"></div><div class="buy"><strong id="full">Повний доступ до 128 PM-промптів</strong><br><button id="buy">Повний доступ — 29 €</button></div></main><div class="modal" id="modal"><div class="box"><span class="close" id="close">✕</span><h2 id="mt"></h2><pre id="mp"></pre></div></div><script>
const CAT_UK=["Ініціація та планування","Обсяг проєкту та управління змінами","Agile / Scrum / Kanban","Управління командою","Стейкхолдери та комунікації","Управління ризиками та проблемами","Терміни та графік","Бюджет, дохід і маржинальність","Контракти та моделі співпраці","Конфлікти та складні ситуації","Прийняття управлінських рішень","Завершення та покращення проєкту","Якість, вимоги та метрики","Ресурси, залежності та delivery","Лідерство, трансформації та PMO"];const CAT_EN=["Initiation & Planning","Project Scope & Change Management","Agile / Scrum / Kanban","Team Management","Stakeholders & Communication","Risk & Issue Management","Schedule & Timeline","Budget, Revenue & Margin","Contracts & Cooperation Models","Conflicts & Difficult Situations","Management Decision-Making","Project Closure & Improvement","Quality, Requirements & Metrics","Resources, Dependencies & Delivery","Leadership, Transformation & PMO"];const CAT_DE=["Projektinitiierung & Planung","Projektumfang & Change Management","Agile / Scrum / Kanban","Teammanagement","Stakeholder & Kommunikation","Risiko- & Issue-Management","Termine & Zeitplan","Budget, Umsatz & Marge","Vertr\u00e4ge & Zusammenarbeitsmodelle","Konflikte & schwierige Situationen","Managemententscheidungen","Projektabschluss & Verbesserung","Qualit\u00e4t, Anforderungen & Kennzahlen","Ressourcen, Abh\u00e4ngigkeiten & Delivery","Leadership, Transformation & PMO"];const CAT_ES=["Iniciaci\u00f3n y planificaci\u00f3n","Alcance y gesti\u00f3n del cambio","Agile / Scrum / Kanban","Gesti\u00f3n de equipos","Stakeholders y comunicaci\u00f3n","Riesgos e incidencias","Calendario y plazos","Presupuesto, ingresos y margen","Contratos y modelos de colaboraci\u00f3n","Conflictos y situaciones dif\u00edciles","Toma de decisiones de gesti\u00f3n","Cierre y mejora del proyecto","Calidad, requisitos y m\u00e9tricas","Recursos, dependencias y delivery","Liderazgo, transformaci\u00f3n y PMO"];const UI={uk:{sub:'360 професійних PM-сценаріїв',all:'Усі категорії',search:'Пошук сценарію...',open:'Відкрити промпт',download:'Скачати',full:'Повний доступ до 360 PM-промптів',buy:'Повний доступ — 29 €'},en:{sub:'360 professional PM scenarios',all:'All categories',search:'Search scenarios...',open:'Open prompt',download:'Download',full:'Full access to 360 PM prompts',buy:'Full access — €29'},de:{sub:'360 professionelle PM-Szenarien',all:'Alle Kategorien',search:'Szenarien suchen...',open:'Prompt öffnen',download:'Herunterladen',full:'Vollzugriff auf 360 PM-Prompts',buy:'Vollzugriff — 29 €'},es:{sub:'360 escenarios profesionales de PM',all:'Todas las categorías',search:'Buscar escenarios...',open:'Abrir prompt',download:'Descargar',full:'Acceso completo a 360 prompts de PM',buy:'Acceso completo — 29 €'}};let lang='uk',data=[];async function load(){data=await fetch('data-'+lang+'.json').then(r=>r.json());render()}function cats(){return lang==='uk'?CAT_UK:lang==='en'?CAT_EN:lang==='de'?CAT_DE:CAT_ES}function render(){let u=UI[lang],cs=cats(),sel=document.getElementById('cat'),old=sel.value;document.getElementById('sub').textContent=u.sub;document.getElementById('search').placeholder=u.search;document.getElementById('full').textContent=u.full;document.getElementById('buy').textContent=u.buy;sel.innerHTML='<option value="">'+u.all+'</option>'+cs.map((x,i)=>'<option value="'+i+'">'+x+'</option>').join('');if(old)sel.value=old;let q=document.getElementById('search').value.toLowerCase(),ci=sel.value,ukcat=CAT_UK[Number(ci)];let list=data.filter(x=>(!ci||x.category===ukcat)&&(!q||(x.title+' '+x.description).toLowerCase().includes(q)));document.getElementById('grid').innerHTML=list.map(x=>'<article class="card"><h3>'+x.id+'. '+x.title+'</h3><p>'+x.description+'</p><div class="actions"><button onclick="openP('+x.id+')">'+u.open+'</button><button class="download" onclick="downloadP('+x.id+')">'+u.download+'</button></div></article>').join('');document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang))}function openP(id){let x=data.find(a=>a.id===id);if(!x)return;document.getElementById('mt').textContent=x.id+'. '+x.title;document.getElementById('mp').textContent=x.prompt;document.getElementById('modal').classList.add('open')}function downloadP(id){let x=data.find(a=>a.id===id);if(!x)return;let h=lang==='uk'?'Ситуація':lang==='en'?'Scenario':lang==='de'?'Szenario':'Escenario';let text=x.title+'\n\n'+h+': '+x.title+'\n\n'+x.prompt;let blob=new Blob([text],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(lang==='uk'?'PM-запит':lang==='en'?'PM-prompt':lang==='de'?'PM-Prompt':'PM-prompt')+'-'+x.id+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')};document.getElementById('cat').onchange=render;document.getElementById('search').oninput=render;document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.documentElement.lang=lang;load()});document.getElementById('buy').onclick=()=>alert(lang==='uk'?'Платіжну сторінку ще не підключено.':lang==='en'?'Payment page is not connected yet.':'Strona płatności nie jest jeszcze podłączona.');load();</script></body></html>
