<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>AI Project Management Machine — 128 PM scenarios</title><style>
:root{--bg:#06111d;--card:#0b1b2a;--line:#244058;--txt:#eaf2f7;--muted:#8fa5b8;--accent:#55d6a3}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#06111d,#0a1928);color:var(--txt);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.langs button,.controls select,.controls input{background:#0b1b2a;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px 12px}.langs button{cursor:pointer}.langs .on{border-color:var(--accent)}.controls{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}.controls>*{flex:1;min-width:190px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px}.card h3{font-size:15px;margin:0 0 8px}.card p{color:var(--muted);font-size:13px;min-height:42px}.card button,.buy button{cursor:pointer;border:1px solid var(--line);background:#10263a;color:#fff;border-radius:9px;padding:9px 12px;width:100%}.buy{margin-top:22px;text-align:center;border:1px solid var(--accent);border-radius:15px;padding:20px;background:#081d2a}.buy button{margin-top:10px;background:var(--accent);color:#062016;font-weight:800;max-width:300px}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.open{display:flex}.box{max-width:820px;max-height:90vh;overflow:auto;background:#091827;border:1px solid var(--line);border-radius:16px;padding:22px}.box pre{white-space:pre-wrap;font:inherit}.close{float:right;cursor:pointer}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.controls{display:block}.controls>*{display:block;width:100%;margin-bottom:9px}}
</style></head><body><main class="wrap"><div class="top"><div><h1 id="title">AI Project Management Machine</h1><p id="sub">128 унікальних професійних PM-сценаріїв</p></div><div class="langs"><button data-l="uk" class="on">UA</button><button data-l="en">EN</button><button data-l="pl">PL</button></div></div><div class="controls"><select id="cat"></select><input id="search" placeholder="Пошук сценарію..."></div><div class="grid" id="grid"></div><div class="buy"><strong id="full">Повний доступ до 128 PM-промптів</strong><br><button id="buy">Повний доступ — 29 €</button></div></main><div class="modal" id="modal"><div class="box"><span class="close" id="close">✕</span><h2 id="mt"></h2><pre id="mp"></pre></div></div><script>
const CAT_UK=["Ініціація та планування", "Scope і управління змінами", "Agile / Scrum / Kanban", "Управління командою", "Стейкхолдери та комунікації", "Ризики та проблеми", "Терміни та графік", "Бюджет, дохід і маржинальність", "Контракти та моделі співпраці", "Конфлікти та складні ситуації", "Прийняття управлінських рішень", "Завершення та покращення проєкту"];const CAT_EN=['Initiation & Planning','Scope & Change Management','Agile / Scrum / Kanban','Team Management','Stakeholders & Communication','Risks & Issues','Schedule & Timeline','Budget, Revenue & Margin','Contracts & Cooperation Models','Conflicts & Difficult Situations','Management Decisions','Project Closure & Improvement'];const CAT_PL=['Inicjacja i planowanie','Zakres i zarządzanie zmianą','Agile / Scrum / Kanban','Zarządzanie zespołem','Interesariusze i komunikacja','Ryzyka i problemy','Terminy i harmonogram','Budżet, przychód i marża','Kontrakty i modele współpracy','Konflikty i trudne sytuacje','Decyzje zarządcze','Zamknięcie i doskonalenie projektu'];
const UI={uk:{sub:'128 унікальних професійних PM-сценаріїв',all:'Усі категорії',search:'Пошук сценарію...',open:'Відкрити промпт',full:'Повний доступ до 128 PM-промптів',buy:'Повний доступ — 29 €'},en:{sub:'128 unique professional PM scenarios',all:'All categories',search:'Search scenarios...',open:'Open prompt',full:'Full access to 128 PM prompts',buy:'Full access — €29'},pl:{sub:'128 unikalnych profesjonalnych scenariuszy PM',all:'Wszystkie kategorie',search:'Szukaj scenariusza...',open:'Otwórz prompt',full:'Pełny dostęp do 128 promptów PM',buy:'Pełny dostęp — 29 €'}};
let lang='uk',data=[];async function load(){data=await fetch('data-'+lang+'.json').then(r=>r.json());render()}function cats(){return lang==='uk'?CAT_UK:lang==='en'?CAT_EN:CAT_PL}function render(){let u=UI[lang],cs=cats(),sel=document.getElementById('cat'),old=sel.value;document.getElementById('sub').textContent=u.sub;document.getElementById('search').placeholder=u.search;document.getElementById('full').textContent=u.full;document.getElementById('buy').textContent=u.buy;sel.innerHTML='<option value="">'+u.all+'</option>'+cs.map((x,i)=>'<option value="'+i+'">'+x+'</option>').join('');if(old)sel.value=old;let q=document.getElementById('search').value.toLowerCase(),ci=sel.value,ukcat=CAT_UK[Number(ci)];let list=data.filter(x=>(!ci||x.category===ukcat)&&(!q||(x.title+' '+x.description).toLowerCase().includes(q)));document.getElementById('grid').innerHTML=list.map(x=>'<article class="card"><h3>'+x.id+'. '+x.title+'</h3><p>'+x.description+'</p><button onclick="openP('+x.id+')">'+u.open+'</button></article>').join('');document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang))}function openP(id){let x=data.find(a=>a.id===id);if(!x)return;document.getElementById('mt').textContent=x.id+'. '+x.title;document.getElementById('mp').textContent=x.prompt;document.getElementById('modal').classList.add('open')}document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')};document.getElementById('cat').onchange=render;document.getElementById('search').oninput=render;document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.documentElement.lang=lang;load()});document.getElementById('buy').onclick=()=>alert(lang==='uk'?'Платіжну сторінку ще не підключено.':lang==='en'?'Payment page is not connected yet.':'Strona płatności nie jest jeszcze podłączona.');load();</script></body></html>
