<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMBOK 8 Prompt Library</title>
<style>
:root{
  --blue-950:#0d2438;
  --blue-900:#123350;
  --blue-800:#164066;
  --blue-700:#1b4d7a;
  --line:#3f6d94;
  --line-soft:#2a5478;
  --paper:#eef4f8;
  --paper-dim:#c9d9e6;
  --amber:#e8a33d;
  --amber-soft:#f0c179;
  --white:#ffffff;
  --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
  --sans:'Inter','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--blue-950);
  background-image:
    linear-gradient(var(--line-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
  background-size:36px 36px;
  color:var(--paper);
  font-family:var(--sans);
  line-height:1.55;
}
::selection{background:var(--amber);color:var(--blue-950);}

/* ---------- Header ---------- */
header{
  position:sticky; top:0; z-index:50;
  background:rgba(13,36,56,0.92);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
.header-inner{
  max-width:1280px; margin:0 auto; padding:18px 28px;
  display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:14px;}
.brand-mark{
  width:40px;height:40px; border:1.5px solid var(--amber); border-radius:3px;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-weight:700; color:var(--amber); font-size:13px;
  position:relative;
}
.brand-mark::before,.brand-mark::after{
  content:""; position:absolute; width:6px; height:6px; border:1px solid var(--amber);
}
.brand-mark::before{top:-4px;left:-4px;border-right:none;border-bottom:none;}
.brand-mark::after{bottom:-4px;right:-4px;border-left:none;border-top:none;}
.brand-text h1{font-size:17px; margin:0; font-weight:700; letter-spacing:0.3px;}
.brand-text p{margin:2px 0 0; font-size:12.5px; color:var(--paper-dim); font-family:var(--mono);}

.lang-switch{display:flex; gap:2px; border:1px solid var(--line); border-radius:4px; overflow:hidden;}
.lang-switch button{
  font-family:var(--mono); font-size:12.5px; letter-spacing:0.5px; font-weight:600;
  padding:8px 14px; background:transparent; border:none; color:var(--paper-dim);
  cursor:pointer; transition:all .15s;
}
.lang-switch button + button{border-left:1px solid var(--line);}
.lang-switch button:hover{background:var(--blue-800); color:var(--white);}
.lang-switch button.active{background:var(--amber); color:var(--blue-950);}

/* ---------- Hero ---------- */
.hero{max-width:1280px; margin:0 auto; padding:40px 28px 20px;}
.hero-tag{
  display:inline-block; font-family:var(--mono); font-size:11.5px; letter-spacing:1.5px;
  color:var(--amber); border:1px solid var(--amber); padding:4px 10px; border-radius:3px;
  text-transform:uppercase; margin-bottom:16px;
}
.hero h2{font-size:clamp(28px,4vw,42px); margin:0 0 10px; font-weight:800; letter-spacing:-0.5px; max-width:820px;}
.hero p{color:var(--paper-dim); font-size:16px; max-width:640px; margin:0 0 22px;}

.search-wrap{position:relative; max-width:520px;}
#search{
  width:100%; padding:13px 16px 13px 42px; background:var(--blue-900);
  border:1px solid var(--line); border-radius:5px; color:var(--white); font-size:14.5px;
  font-family:var(--sans); outline:none; transition:border-color .15s;
}
#search:focus{border-color:var(--amber);}
#search::placeholder{color:var(--paper-dim);}
.search-icon{
  position:absolute; left:15px; top:50%; transform:translateY(-50%);
  width:16px; height:16px; opacity:0.5;
}

/* ---------- Layout ---------- */
.layout{max-width:1280px; margin:0 auto; padding:10px 28px 80px; display:grid; grid-template-columns:230px 1fr; gap:36px;}
@media (max-width:860px){.layout{grid-template-columns:1fr;}}

nav.toc{position:sticky; top:100px; align-self:start; display:flex; flex-direction:column; gap:4px;}
.toc-group-label{font-family:var(--mono); font-size:11px; letter-spacing:1px; color:var(--paper-dim); text-transform:uppercase; margin:16px 0 6px; padding-left:10px;}
.toc-group-label:first-child{margin-top:0;}
.toc a{
  color:var(--paper-dim); text-decoration:none; font-size:13.5px; padding:7px 10px;
  border-left:2px solid transparent; transition:all .15s; border-radius:0 4px 4px 0;
}
.toc a:hover{color:var(--white); background:var(--blue-900); border-left-color:var(--line);}
.count-pill{
  display:inline-block; margin-top:14px; padding:6px 12px; font-family:var(--mono); font-size:12px;
  background:var(--blue-900); border:1px solid var(--line); border-radius:20px; color:var(--amber-soft);
}

main{min-width:0;}
section.group{margin-bottom:52px; scroll-margin-top:90px;}
.group-header{
  display:flex; align-items:baseline; gap:14px; margin-bottom:22px;
  border-bottom:1px solid var(--line); padding-bottom:12px;
}
.group-number{
  font-family:var(--mono); font-size:13px; color:var(--amber); border:1px solid var(--amber);
  width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:3px; flex-shrink:0;
}
.group-header h3{font-size:22px; margin:0; font-weight:700;}

.card{
  background:linear-gradient(180deg, var(--blue-900), var(--blue-950));
  border:1px solid var(--line); border-radius:7px; margin-bottom:16px; overflow:hidden;
  transition:border-color .15s;
}
.card:hover{border-color:var(--amber-soft);}
.card-head{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:15px 18px; cursor:pointer; user-select:none;
}
.card-head-left{display:flex; align-items:baseline; gap:12px; min-width:0;}
.card-id{font-family:var(--mono); font-size:12px; color:var(--amber-soft); flex-shrink:0;}
.card-title{font-size:15.5px; font-weight:600; color:var(--white); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.card-tag{
  font-family:var(--mono); font-size:10.5px; color:var(--paper-dim); border:1px solid var(--line-soft);
  padding:3px 8px; border-radius:3px; flex-shrink:0; white-space:nowrap;
}
.chevron{width:14px; height:14px; flex-shrink:0; color:var(--paper-dim); transition:transform .2s;}
.card.open .chevron{transform:rotate(180deg);}

.card-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
.card.open .card-body{max-height:900px;}
.card-body-inner{padding:0 18px 18px;}
pre.prompt{
  background:var(--blue-950); border:1px solid var(--line-soft); border-radius:5px;
  padding:16px; margin:0 0 12px; font-family:var(--mono); font-size:12.8px; line-height:1.65;
  color:var(--paper); white-space:pre-wrap; word-break:break-word;
}
.copy-btn{
  display:inline-flex; align-items:center; gap:7px; background:var(--amber); color:var(--blue-950);
  border:none; padding:8px 16px; border-radius:5px; font-family:var(--mono); font-size:12px;
  font-weight:700; cursor:pointer; letter-spacing:0.3px; transition:background .15s;
}
.copy-btn:hover{background:var(--amber-soft);}
.copy-btn svg{width:13px;height:13px;}
.copy-btn.copied{background:#5fb87a; color:var(--blue-950);}

.no-results{display:none; color:var(--paper-dim); font-family:var(--mono); font-size:13px; padding:40px 0; text-align:center;}

footer{
  border-top:1px solid var(--line); margin-top:40px; padding:28px;
  max-width:1280px; margin-left:auto; margin-right:auto;
}
footer p{color:var(--paper-dim); font-size:12px; max-width:760px; margin:0; font-family:var(--mono); line-height:1.7;}

@media (max-width:600px){
  .card-title{white-space:normal;}
  .header-inner{padding:14px 16px;}
  .hero{padding:28px 16px 16px;}
  .layout{padding:10px 16px 60px;}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark">P8</div>
      <div class="brand-text">
        <h1 data-t="title">Бібліотека промптів PMBOK 8</h1>
        <p data-t="subtitle">55 шаблонів для управління проєктами</p>
      </div>
    </div>
    <div class="lang-switch" id="langSwitch">
      <button data-lang="uk" class="active">UA</button>
      <button data-lang="en">EN</button>
      <button data-lang="pl">PL</button>
    </div>
  </div>
</header>

<div class="hero">
  <span class="hero-tag">PMBOK® Guide — 8th Edition</span>
  <h2 data-t="title">Бібліотека промптів PMBOK 8</h2>
  <p data-t="subtitle">55 шаблонів для управління проєктами на основі 8-го видання PMBOK</p>
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search" data-t-placeholder="searchPlaceholder" placeholder="Пошук за ключовим словом…">
  </div>
</div>

<div class="layout">
  <nav class="toc" id="toc"></nav>
  <main id="main">
    <div class="no-results" id="noResults">— NOT_FOUND —</div>
  </main>
</div>

<footer>
  <p data-t="footNote">Шаблони створені на основі публічно відомої структури PMBOK® Guide — 8th Edition.</p>
</footer>

<script>
/* ====== DATA ====== */
</script>
<script src="data.js"></script>
<script>
(function(){
  let currentLang = 'uk';
  const groupOrder = ['principles','domains','focus','cross'];
  const groupKeyToStrKey = {
    principles:'sectionPrinciples', domains:'sectionDomains',
    focus:'sectionFocus', cross:'sectionCross'
  };

  const mainEl = document.getElementById('main');
  const tocEl = document.getElementById('toc');
  const noResultsEl = document.getElementById('noResults');
  const searchEl = document.getElementById('search');

  function svgChevron(){
    return '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>';
  }
  function svgCopy(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  }

  function render(){
    // header/hero static strings
    document.querySelectorAll('[data-t]').forEach(el=>{
      const key = el.getAttribute('data-t');
      el.textContent = UI_STRINGS[currentLang][key];
    });
    document.querySelectorAll('[data-t-placeholder]').forEach(el=>{
      const key = el.getAttribute('data-t-placeholder');
      el.placeholder = UI_STRINGS[currentLang][key];
    });
    document.documentElement.lang = currentLang;

    // group templates
    const byGroup = {};
    groupOrder.forEach(g=>byGroup[g]=[]);
    TEMPLATES.forEach(t=>byGroup[t.group].push(t));

    // build TOC
    let tocHtml = '';
    groupOrder.forEach(g=>{
      tocHtml += `<div class="toc-group-label">${UI_STRINGS[currentLang][groupKeyToStrKey[g]]}</div>`;
      byGroup[g].forEach(t=>{
        tocHtml += `<a href="#tpl-${t.id}">${String(t.id).padStart(2,'0')} — ${t.title[currentLang]}</a>`;
      });
    });
    tocHtml += `<div class="count-pill">${TEMPLATES.length} ${UI_STRINGS[currentLang].countLabel}</div>`;
    tocEl.innerHTML = tocHtml;

    // build main sections
    let mainHtml = '';
    groupOrder.forEach((g,gi)=>{
      mainHtml += `<section class="group" id="group-${g}">
        <div class="group-header">
          <div class="group-number">${gi+1}</div>
          <h3>${UI_STRINGS[currentLang][groupKeyToStrKey[g]]}</h3>
        </div>`;
      byGroup[g].forEach(t=>{
        mainHtml += `
        <div class="card" id="tpl-${t.id}" data-search="${(t.title[currentLang]+' '+t.body[currentLang]+' '+t.groupLabel[currentLang]).toLowerCase().replace(/"/g,'&quot;')}">
          <div class="card-head" data-toggle="${t.id}">
            <div class="card-head-left">
              <span class="card-id">#${String(t.id).padStart(2,'0')}</span>
              <span class="card-title">${t.title[currentLang]}</span>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              <span class="card-tag">${t.groupLabel[currentLang]}</span>
              ${svgChevron()}
            </div>
          </div>
          <div class="card-body">
            <div class="card-body-inner">
              <pre class="prompt">${t.body[currentLang].replace(/</g,'&lt;')}</pre>
              <button class="copy-btn" data-copy="${t.id}">${svgCopy()}<span class="copy-label">${UI_STRINGS[currentLang].copy}</span></button>
            </div>
          </div>
        </div>`;
      });
      mainHtml += `</section>`;
    });
    mainEl.innerHTML = mainHtml + `<div class="no-results" id="noResults">— NOT_FOUND —</div>`;

    attachHandlers();
    applySearch();
  }

  function attachHandlers(){
    document.querySelectorAll('[data-toggle]').forEach(el=>{
      el.addEventListener('click', ()=>{
        el.closest('.card').classList.toggle('open');
      });
    });
    document.querySelectorAll('[data-copy]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const id = btn.getAttribute('data-copy');
        const tpl = TEMPLATES.find(t=>String(t.id)===id);
        navigator.clipboard.writeText(tpl.body[currentLang]).then(()=>{
          btn.classList.add('copied');
          const label = btn.querySelector('.copy-label');
          const prevText = label.textContent;
          label.textContent = UI_STRINGS[currentLang].copied;
          setTimeout(()=>{ btn.classList.remove('copied'); label.textContent = UI_STRINGS[currentLang].copy; }, 1500);
        });
      });
    });
  }

  function applySearch(){
    const q = searchEl.value.trim().toLowerCase();
    let visibleCount = 0;
    document.querySelectorAll('.card').forEach(card=>{
      const match = !q || card.getAttribute('data-search').includes(q);
      card.style.display = match ? '' : 'none';
      if(match) visibleCount++;
    });
    document.querySelectorAll('.group').forEach(sec=>{
      const anyVisible = Array.from(sec.querySelectorAll('.card')).some(c=>c.style.display!=='none');
      sec.style.display = anyVisible ? '' : 'none';
    });
    document.getElementById('noResults').style.display = visibleCount===0 ? 'block' : 'none';
  }

  searchEl.addEventListener('input', applySearch);

  document.getElementById('langSwitch').addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-lang]');
    if(!btn) return;
    currentLang = btn.getAttribute('data-lang');
    document.querySelectorAll('#langSwitch button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });

  render();
})();
</script>
</body>
</html>
